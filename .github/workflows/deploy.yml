name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: notes
          fetch-depth: 0

      - name: Checkout Quartz
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz-site

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Add notes and site configuration
        shell: bash
        run: |
          rm -rf quartz-site/content
          cp -R notes/content quartz-site/content
          cp notes/quartz.config.yaml quartz-site/quartz.config.yaml

      - name: Install dependencies
        working-directory: quartz-site
        shell: bash
        run: |
          sed -i 's#https://registry.npmmirror.com/#https://registry.npmjs.org/#g; s#https://cdn.npmmirror.com/#https://registry.npmjs.org/#g' package-lock.json
          npm install --registry=https://registry.npmjs.org

      - name: Build Quartz
        working-directory: quartz-site
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

